[project]
name = "erdos-straus"
version = "0.2.0"
description = "Leftover-credit workbench for the Erdős–Straus conjecture: verified triples, identities, and a Fraction verifier."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sympy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
erdos-straus = "erdos_straus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["erdos_straus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
